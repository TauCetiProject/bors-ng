name: CI
on:
  # Only run when merging to master, or open/synchronize/reopen a PR.
  push:
    branches:
      - master
      - staging
      - trying
  pull_request:
  merge_group:

jobs:
  test:
    name: Test
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.17.3"]
        otp_release: ["27.3.4.13"]
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: ${{ matrix.otp_release }}
          elixir-version: ${{ matrix.elixir }}
      - run: mix deps.get

      - name: Create Postgres Repo
        run: |
          echo "running postgres database creation"
          mix ecto.create -r BorsNG.Database.Repo
        env:
          MIX_ENV: test
      - name: Migrate Postgres Repo
        run: |
          echo "running postgres migration"
          mix ecto.migrate -r BorsNG.Database.Repo
        env:
          MIX_ENV: test

      - name: Test streaming failure diagnostics
        run: python3 -m unittest discover -s test -p failure_diagnostics_test.py
      - run: mix test
    services:
      postgresql:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: "Postgres1234"
          POSTGRES_USER: postgres
          POSTGRES_DB: bors_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

  assets:
    name: assets
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: "27.3.4.13"
          elixir-version: "1.17.3"
      - run: mix deps.get
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: assets/.node-version
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - run: npm ci
        working-directory: assets
      - run: npm run deploy
        working-directory: assets

  exfmt:
    name: exfmt
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
      with:
        otp-version: "27.3.4.13"
        elixir-version: "1.17.3"
    - run: mix format --check-formatted

  ci-success:
    name: ci
    if: always()
    needs:
      - assets
      - exfmt
      - test
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
      - name: Done
        run: exit 0
  lint-test:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.17.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/workflows/config/chart-lint.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .github/workflows/config/chart-lint.yaml

      # Disable for now because Bors requires the GitHub application to exists
      # - name: Create kind cluster
      #   uses: helm/kind-action@v1.1.0
      #   if: steps.list-changed.outputs.changed == 'true'
      #
      # - name: Run chart-testing (install)
      #   run: ct install --config .github/workflows/config/chart-lint.yaml
