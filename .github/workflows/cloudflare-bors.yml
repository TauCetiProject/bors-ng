name: Cloudflare bors build

on:
  push:
    branches: [master, feat/cloudflare-bors]
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build the production release image
        run: docker build --tag tauceti-bors:test .

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/index.js
      - run: npx wrangler deploy --dry-run --containers-rollout=none
