name: Cloudflare bors build

on:
  push:
    branches: [master, feat/cloudflare-bors]
  pull_request:

permissions:
  contents: read

jobs:
  webhook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: Postgres1234
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BORS_DATABASE: postgresql
      DATABASE_URL_TEST: postgresql://postgres:Postgres1234@localhost/bors_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17.3'
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix format lib/github/github.ex lib/github/github/server.ex lib/worker/batcher.ex lib/web/controllers/webhook_controller.ex test/controllers/webhook_controller_test.exs
      - uses: actions/upload-artifact@v4
        with:
          name: elixir-formatted-sources
          path: |
            lib/github/github.ex
            lib/github/github/server.ex
            lib/worker/batcher.ex
            lib/web/controllers/webhook_controller.ex
            test/controllers/webhook_controller_test.exs
      - run: mix test test/controllers/webhook_controller_test.exs test/batcher/merge_eligibility_test.exs test/merge_eligibility_http_test.exs
      - run: git diff --exit-code

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build the production release image
        run: docker buildx build --no-cache-filter runtime --load --tag tauceti-bors:test .
      - name: Check outgoing TLS from the release image
        run: |
          docker run --rm --entrypoint /app/bin/bors tauceti-bors:test eval '
            {:ok, _} = Application.ensure_all_started(:hackney)
            options = [ssl_options: BorsNG.TLS.hackney_ssl_options(),
                       connect_timeout: 15_000, recv_timeout: 15_000]

            for url <- ["https://api.github.com/", "https://github.com/login/oauth/authorize",
                        "https://leanprover.zulipchat.com/"] do
              case :hackney.get(url, [], <<>>, options) do
                {:ok, status, _, ref} ->
                  :hackney.close(ref)
                  IO.puts("TLS accepted: #{url} (HTTP #{status})")
                result -> raise "TLS failed for #{url}: #{inspect(result)}"
              end
            end

            for url <- ["https://dv-g3b-emudhra.we-have-a-problem.com/",
                        "https://dv-g3b-aaa-emudhra.we-have-a-problem.com/"] do
              case :hackney.get(url, [], <<>>, options) do
                {:error, {:tls_alert, {reason, _}}} when reason in [:unknown_ca, :bad_certificate] ->
                  IO.puts("TLS rejected compromised chain: #{url}")
                result -> raise "Expected a certificate rejection for #{url}: #{inspect(result)}"
              end
            end
          '

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/index.js
      - run: node --test src/*.test.mjs
      - run: npx wrangler deploy --dry-run --containers-rollout=none
